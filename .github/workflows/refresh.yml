name: Refresh ERP data

on:
  schedule:
    - cron: "17 20 * * 0"   # weekly, Sunday 20:17 UTC = Monday 04:17 SGT
  workflow_dispatch:
    inputs:
      allow_mismatch:
        description: "Continue even if the HTML tables and the PDF disagree"
        type: boolean
        default: false
      push_to_d1:
        description: "Push the new snapshot to Cloudflare D1"
        type: boolean
        default: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --group ingest --group dev

      - name: Fetch, parse, cross-check and build snapshot
        run: |
          uv run gantry-check refresh \
            --db data/local.sqlite \
            --out data/snapshots/snapshot.sql \
            ${{ inputs.allow_mismatch && '--allow-mismatch' || '' }}

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: erp-snapshot-${{ github.run_id }}
          path: |
            data/snapshots/snapshot.sql
            data/local.sqlite
          retention-days: 90

      - name: Push snapshot to D1
        if: ${{ github.event_name == 'schedule' || inputs.push_to_d1 }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 migrations apply gantry-check --remote
          npx --yes wrangler@4 d1 execute gantry-check --remote --yes \
            --file data/snapshots/snapshot.sql
