[project]
name = "gantry-check"
version = "0.1.0"
description = "Estimate Singapore ERP charges for a driving route at a given departure time."
readme = "README.md"
requires-python = ">=3.12"
# Runtime deps only: everything here is bundled into the Cloudflare Python Worker.
# Keep it pure-Python / Pyodide-supported. Heavy ingestion deps live in the `ingest` group.
dependencies = [
    "fastapi",
    "httpx",
    "pydantic>=2",
]

[project.scripts]
gantry-check = "gantry_check.cli:main"

[dependency-groups]
ingest = [
    "pdfplumber",
    "pyshp",
    "pyproj",
]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gantry_check"]

[tool.uv]
default-groups = ["dev", "ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
