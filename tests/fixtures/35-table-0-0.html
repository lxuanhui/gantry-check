<script type="text/javascript">
var d = new Date();
var curr_hour = d.getHours();
var curr_min = d.getMinutes();
var oCell1 = "";
curr_min = curr_min + "";

if (curr_min.length == 1)
{
	 curr_min = "0" + curr_min;
}

var curr_time = curr_hour + "" + curr_min;

function setUp()
{
	 // 0700 - 0705
	 if(curr_time >= 700 && curr_time < 705)
	 {
		 oCell1 = new setObj('row0', '#FFFF99', 'black');
	 }

	 // 0705 - 0800
	 else if(curr_time >= 705 && curr_time < 800)
	 {
		 oCell1 = new setObj('row1', '#FFFF99', 'black');
	 }

	 // 0800 - 0805
	 else if(curr_time >= 800 && curr_time < 805)
	 {
		 oCell1 = new setObj('row2', '#FFFF99', 'black');
	 }

	 // 0805 - 0925
	 else if(curr_time >= 805 && curr_time < 925)
	 {
		 oCell1 = new setObj('row3', '#FFFF99', 'black');
	 }

	 // 0925 - 0930
	 else if(curr_time >= 925 && curr_time < 930)
	 {
		 oCell1 = new setObj('row4', '#FFFF99', 'black');
	 }

	 // 0930 - 0955
	 else if(curr_time >= 930 && curr_time < 955)
	 {
		 oCell1 = new setObj('row5', '#FFFF99', 'black');
	 }

	 // 0955 - 1000
	 else if(curr_time >= 955 && curr_time < 1000)
	 {
		 oCell1 = new setObj('row6', '#FFFF99', 'black');
	 }

	 // 1000 - 2000
	 else if(curr_time >= 1000 && curr_time < 2000)
	 {
		 oCell1 = new setObj('row7', '#FFFF99', 'black');
	 }

} 

onload = setUp; 

function setObj(id,bgCol,color)
{
	 if(document.getElementById)
	 {
		 this.obj = document.getElementById(id).style;
		 this.obj.backgroundColor=bgCol;
		 this.obj.color=color;
	 }
	 else if(document.all)
	 {
		 this.obj = document.all[id].style;
		 this.obj.backgroundColor=bgCol;
		 this.obj.color=color;
	 }
	 else if(document.layers)
	 {
		 this.obj = document.layers[id];
		 this.obj.bgColor=bgCol;
		 this.obj.color=color;
	 }
	 return this.obj;

}
</script>
